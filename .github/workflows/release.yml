name: Release

# Builds the DMG and attaches it to a GitHub release when the release is published.
#
# It can also be started by hand (Actions > Release > Run workflow):
#   - with a tag: rebuilds that release's DMG and replaces the attached files;
#   - without a tag: a dry run that only keeps the DMG as a workflow artifact.
#
# Optional repository secrets for a Developer ID signed and notarized DMG
# (without them the app is signed ad hoc):
#   MACOS_CERTIFICATE_P12       base64 of a "Developer ID Application" .p12 export
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#                               Apple ID, team ID and app-specific password for notarytool

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and upload to (leave empty for a dry run)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build and attach DMG
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Release events check out the release tag; manual runs use the given tag, if any.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          if [ -n "$tag" ]; then
            label="${tag#v}"
          else
            label="dev-${GITHUB_SHA:0:7}"
          fi
          # CFBundleShortVersionString takes up to three numbers: v1.2.3-beta.1 -> 1.2.3.
          version="$(printf '%s' "$label" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          version="${version:-0.0.0}"
          safe_label="$(printf '%s' "$label" | tr -c 'A-Za-z0-9._-' '-')"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "dmg_name=BB-Manager-$safe_label.dmg"
          } >> "$GITHUB_OUTPUT"
          echo "Tag '${tag:-<none, dry run>}' -> version $version, build $GITHUB_RUN_NUMBER"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test --package-path BBManagerKit

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 contains no 'Developer ID Application' identity"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Build DMG
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: scripts/build-dmg.sh

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build/build-dmg.log
          if-no-files-found: ignore

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.dmg_name }}
          path: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.checksum }}
          if-no-files-found: error

      - name: Attach DMG to the GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          CHECKSUM: ${{ steps.dmg.outputs.checksum }}
        run: gh release upload "$TAG" "$DMG" "$CHECKSUM" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH"
